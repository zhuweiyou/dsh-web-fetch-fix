# dsh-web-fetch-fix — bundle patch layer.
#
# The plugin code is a drop-in copy of the official @deepseek-ai/dsh-web-fetch-http
# (tag dsh-v0.2.1-rc.3, see ../web-fetch-http/) whose only behavioural change is
# that the public-IP (SSRF) address gate is removed. That gate rejects reserved
# addresses such as 198.18.0.0/15 that a local Clash/VPN TUN in fake-ip mode hands
# out for perfectly public hostnames.
#
# 1) Select the patched provider for web_fetch. An id-targeted patch REPLACES the
#    matched entry's whole `config`, so the base default `searchProvider`
#    (`deepseek-official`) is restated verbatim to leave web_search unchanged.
#    To tune the provider, append its own fields here, e.g.
#        maxBodyChars: 200000
#        timeoutMs: 30000
- id: web
  name: '@deepseek-ai/dsh-web'
  config:
    searchProvider: deepseek-official
    fetchProvider: web-fetch-fix

# 2) Register the patched provider. It registers under id `web-fetch-fix`
#    (see src/provider.ts) so it coexists with the stock `http` provider.
- insert:
    - id: web-fetch-fix
      name: dsh-web-fetch-fix
